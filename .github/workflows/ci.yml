name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # 這裡只裝 pytest，故意不裝 requirements.txt。
        # requirements.txt 包含 torch / torchvision，完整安裝要下載 2GB 以上、
        # 耗時約十分鐘，而目前的冒煙測試只依賴標準庫。
        # 若日後新增需要第三方套件的測試，在此補裝該套件即可（盡量挑輕量的）。
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Syntax check
        # 只做語法編譯，不 import，因此不需要 torch 等重型依賴。
        # 目的：抓出沒有被測試覆蓋到的模組中的語法錯誤。
        run: |
          python -m compileall -q \
            config.py \
            module1_data module2_model module3_web \
            module4_analysis module5_autotrain module6_normalize

      - name: Run tests
        # pytest.ini 把收集範圍限定在 tests/。
        # 根目錄下若有 test_*.py 形式的維運腳本（會打真實 API）也不會被誤收。
        run: python -m pytest -v
